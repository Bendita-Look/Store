name: Mirror to store repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: mirror-store
  cancel-in-progress: true

jobs:
  mirror:
    if: github.repository == 'DaviCastr/SAP-UI5-BenditaLook'
    runs-on: ubuntu-latest
    env:
      MIRROR_REPOSITORIES: ${{ vars.MIRROR_REPOSITORIES || 'BenditaLook/Store,Bendita-Look/Store' }}
      MIRROR_TOKEN: ${{ secrets.STORE_MIRROR_TOKEN }}

    steps:
      - name: Check mirror token
        run: |
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "::error::Missing repository secret STORE_MIRROR_TOKEN (fine-grained token owned by the store organization, Contents and Workflows read and write)."
            exit 1
          fi

      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to the first available mirror
        run: |
          IFS=',' read -ra candidates <<< "$MIRROR_REPOSITORIES"
          for candidate in "${candidates[@]}"; do
            repository="$(echo "$candidate" | xargs)"
            url="https://x-access-token:${MIRROR_TOKEN}@github.com/${repository}.git"
            if git ls-remote --heads "$url" > /dev/null 2>&1; then
              git push --force "$url" HEAD:main
              echo "Mirrored to ${repository}"
              exit 0
            fi
            echo "::notice::${repository} is not reachable, trying the next candidate"
          done
          echo "::error::None of the mirror repositories is reachable: ${MIRROR_REPOSITORIES}"
          exit 1
