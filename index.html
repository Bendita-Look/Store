<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="theme-color" content="#ffcad4">
    <meta name="description" content="Bendita Look - moda feminina">
    <title>Bendita Look</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;display=swap">
    <link rel="icon" href="img/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <script>
        // Instalação (PWA). O manifest só entra fora do iOS: no iPhone ele faria
        // a barra de status usar as cores fixas do manifest, e sem ele a barra
        // herda a cor do header. No Chrome/Edge (Android e PC) o manifest é o que
        // libera "Instalar app"; o evento é guardado cedo para o botão da tela.
        (function () {
            var isIos = /iPad|iPhone|iPod/.test(navigator.userAgent)
                || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
            if (!isIos) {
                var link = document.createElement("link");
                link.rel = "manifest";
                link.href = "manifest.webmanifest";
                document.head.appendChild(link);
            }
            window.addEventListener("beforeinstallprompt", function (event) {
                event.preventDefault();
                window.__blInstallPrompt = event;
                window.dispatchEvent(new Event("bl-installable"));
            });
        })();
    </script>
    <style>
        html, body, body > div, #container, #container-uiarea {
            height: 100%;
        }
        @supports (height: 100dvh) {
            html, body, body > div, #container, #container-uiarea {
                height: 100dvh;
            }
        }
        /* Com viewport-fit=cover o app ocupa a tela física inteira, ficando
           debaixo do notch/Dynamic Island, dos cantos arredondados e da barra
           de gestos (site salvo na tela inicial, em tela cheia). Reservamos as
           safe areas das laterais e de baixo no body (a de baixo com uma folga
           extra, proporcional, que some fora da tela cheia). A de cima fica a
           cargo do header (style.css), que se estende por baixo da barra de
           status. Fora do modo tela cheia o env() vale 0.
           O iOS 26 pinta a barra de status com a cor de fundo do body (não usa
           mais o theme-color), por isso o body tem a cor do header e só a faixa
           de baixo recebe a cor do conteúdo (body::after). */
        html, html body {
            background: #ffcad4 !important;
        }
        html body {
            box-sizing: border-box;
            padding: 0 env(safe-area-inset-right, 0px)
                calc(env(safe-area-inset-bottom, 0px) * 1.5) env(safe-area-inset-left, 0px);
        }
        html body::after {
            content: "";
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: calc(env(safe-area-inset-bottom, 0px) * 1.5);
            background: #fffafa;
            pointer-events: none;
        }
        body > div, #container, #container-uiarea {
            height: 100%;
        }
        /* Dialogs esticados (celular) são fixos na viewport e ignoram o
           padding do body, então recebem as mesmas margens de segurança. */
        html body .sapMDialog.sapMDialogStretched {
            top: env(safe-area-inset-top, 0px) !important;
            bottom: env(safe-area-inset-bottom, 0px) !important;
            left: env(safe-area-inset-left, 0px) !important;
            right: env(safe-area-inset-right, 0px) !important;
            width: auto !important;
            height: auto !important;
            max-height: none !important;
        }
        @supports (-webkit-touch-callout: none) {
            input, textarea, select {
                font-size: 16px !important;
            }
        }
    </style>
    <script
        id="sap-ui-bootstrap"
        src="https://openui5.hana.ondemand.com/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resource-roots='{
            "apps.dflc.benditalook": "./"
        }'
        data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compat-version="edge"
        data-sap-ui-async="true"
        data-sap-ui-frame-options="trusted"
    ></script>
</head>
<body class="sapUiBody" id="content">
    <div
        data-sap-ui-component
        data-name="apps.dflc.benditalook"
        data-id="container"
        data-settings='{"id" : "apps.dflc.benditalook"}'
        data-handle-validation="true"
    ></div>
</body>
</html>
